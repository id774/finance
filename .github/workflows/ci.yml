name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'doc/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        # The default run excludes the integration marker, so nothing
        # here reaches the J-Quants API. Those checks depend on a third
        # party and must not decide whether a commit is green.
        #
        # No J-Quants API key is configured for this workflow and none
        # may be: CI has no reason to hold a credential it cannot use,
        # and the suite is built so that it does not need one. The empty
        # value below makes a key leaking in from anywhere else visible
        # as a failure rather than as a silent live request.
        env:
          JQUANTS_API_KEY: ""
        run: pytest
